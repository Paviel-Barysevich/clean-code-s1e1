<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body class="body">
    <header class="banner">
      <h1 class="hidden" role="banner">The Eisenhower matrix</h1>
      <img
        src="./eisenhower-matrix.jpg"
        class="banner-image"
        alt="The matrix two by two has four squares: the first one has a name
        'DO', it's urgent and important; the second one has a name 'PLAN',
        it's not urgent but important; the third one has a name 'DELEGATE',
        it's urgent but not important and the last one has a name 'ELIMINATE',
        it's neither urgent nor important"
      />
      <a
        class="banner-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section aria-labelledby="heading-factory">
        <h2 id="heading-factory" class="heading">Add Item</h2>
        <div class="main-new-todo-wrapper">
          <input id="main-new-todo" class="input task" type="text" />
          <button class="button button-add" type="button">Add</button>
        </div>
      </section>
      <section aria-labelledby="heading-todo">
        <h2 id="heading-todo" class="heading">Todo</h2>
        <ul id="todo-list" class="list">
          <li class="list-item">
            <input class="input" type="checkbox" name="todo-checkbox" />
            <label for="input-1" class="label task">Pay Bills</label>
            <input id="input-1" class="input task" type="text" />
            <button class="button button-edit" type="button">Edit</button>
            <button class="button button-delete" type="button">
              <img src="./remove.svg" class="img-delete" alt="delete button"/>
            </button>
          </li>
          <li class="list-item is-active">
            <input class="input" type="checkbox" name="todo-checkbox" />
            <label for="input-2" class="label task">Go Shopping</label>
            <input
              id="input-2"
              class="input task"
              type="text"
              value="go shopping"
            />
            <button class="button button-edit" type="button">Save</button>
            <button class="button button-delete" type="button">
              <img src="./remove.svg" class="img-delete" alt="delete button" />
            </button>
          </li>
        </ul>
      </section>
      <section aria-labelledby="heading-done">
        <h2 id="heading-done" class="heading">Completed</h2>
        <ul id="done-list" class="list">
          <li class="list-item">
            <input class="input" type="checkbox" name="done-checkbox" checked />
            <label for="input-3" class="label task">See the Doctor</label>
            <input id="input-3" class="input task" type="text" />
            <button class="button button-edit" type="button">Edit</button>
            <button class="button button-delete" type="button">
              <img src="./remove.svg" class="img-delete" alt="delete button" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
