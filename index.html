<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>
  <body class="body">
    <header class="banner">
      <h1 class="hidden" role="banner">The Eisenhower matrix</h1>
      <img
        src="./eisenhower-matrix.jpg"
        class="banner__image"
        alt="The matrix two by two has four squares: the first one has a name
        'DO', it's urgent and important; the second one has a name 'PLAN',
        it's not urgent but important; the third one has a name 'DELEGATE',
        it's urgent but not important and the last one has a name 'ELIMINATE',
        it's neither urgent nor important"
      />
      <a
        class="banner__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="factory" aria-labelledby="heading-factory">
        <h2 id="heading-factory" class="factory__heading heading">Add Item</h2>
        <div class="factory__wrapper">
          <input id="main-new-todo" class="factory__input task" type="text" />
          <button class="factory__button button" type="button">Add</button>
        </div>
      </section>
      <section class="todos" aria-labelledby="heading-todo">
        <h2 id="heading-todo" class="todos__heading heading">Todo</h2>
        <ul id="todo-list" class="todos__list list">
          <li class="list__item item">
            <input
              class="input item__checkbox"
              type="checkbox"
              name="todo-checkbox"
            />
            <label for="input-1" class="item__label task">Pay Bills</label>
            <input id="input-1" class="item__input task" type="text" />
            <button class="button button--edit" type="button">Edit</button>
            <button class="button button--delete" type="button">
              <img
                src="./remove.svg"
                class="button__image"
                alt="delete button"
              />
            </button>
          </li>
          <li class="list__item item is-active">
            <input
              class="input item__checkbox"
              type="checkbox"
              name="todo-checkbox"
            />
            <label for="input-2" class="item__label task">Go Shopping</label>
            <input
              id="input-2"
              class="item__input task"
              type="text"
              value="go shopping"
            />
            <button class="button button--edit" type="button">Save</button>
            <button class="button button--delete" type="button">
              <img
                src="./remove.svg"
                class="button__image"
                alt="delete button"
              />
            </button>
          </li>
        </ul>
      </section>
      <section class="done" aria-labelledby="heading-done">
        <h2 id="heading-done" class="done__heading heading">Completed</h2>
        <ul id="done-list" class="done__list list">
          <li class="list__item item">
            <input
              class="input item__checkbox"
              type="checkbox"
              name="done-checkbox"
              checked
            />
            <label for="input-3" class="item__label task">See the Doctor</label>
            <input id="input-3" class="item__input task" type="text" />
            <button class="button button--edit" type="button">Edit</button>
            <button class="button button--delete" type="button">
              <img
                src="./remove.svg"
                class="button__image"
                alt="delete button"
              />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
